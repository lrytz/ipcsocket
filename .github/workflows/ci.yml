name: CI
on: [pull_request, push]

jobs:
  dacl-repro:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 8
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Reproduce DACL use-after-free
        shell: bash
        run: sbt "testOnly org.scalasbt.ipcsocket.Win32DaclLifetimeTest -- -v"
