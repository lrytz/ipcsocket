name: CI
on: [pull_request, push]

jobs:
  windows-repro:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [8, 25]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "${{ matrix.java }}"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Run the new Windows tests
        shell: bash
        run: sbt "buildNativeArtifacts; testOnly *ServerSideCloseTest* -- -v"
