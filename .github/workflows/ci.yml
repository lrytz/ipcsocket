name: CI
on: [pull_request, push]

jobs:
  test:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Changing this will change glibc
          - os: ubuntu-22.04
            java: 8
            jobtype: 1
          - os: ubuntu-24.04
            java: 25
            jobtype: 2
          - os: macos-15-intel
            java: 8
            jobtype: 1
          - os: macos-15
            java: 8
            jobtype: 1
          - os: macos-15
            java: 25
            jobtype: 1
          - os: windows-latest
            java: 8
            jobtype: 1
          - os: windows-latest
            java: 25
            jobtype: 2
    runs-on: ${{ matrix.os }}
    env:
      JAVA_OPTS: -Xms800M -Xmx2G -Xss6M -XX:ReservedCodeCacheSize=128M -server -Dsbt.io.virtual=false -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms800M -Xmx2G -Xss6M -XX:ReservedCodeCacheSize=128M -server -Dsbt.io.virtual=false -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "${{ matrix.java }}"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Set up MinGW
        if: ${{ runner.os == 'Linux' }}
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64
      - name: Set up gcc-aarch64-linux-gnu
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: sudo apt-get -y install gcc-aarch64-linux-gnu
      - name: Test repeatedly
        shell: bash
        run: |
          sbt buildNativeArtifacts
          failed=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "::group::run $i"
            sbt test 2>&1 | tee run-$i.log || { failed=1; echo "RUN $i FAILED"; }
            echo "::endgroup::"
          done
          echo "== failures"
          grep -h -E "Test .* failed|Failed: Total|exit code|TimeoutException" run-*.log || true
          echo "== JNI check warnings"
          grep -h -A4 -E "WARNING in native method|FATAL ERROR in native method" run-*.log | sort | uniq -c | sort -rn | head -40 || true
          exit $failed
      - name: Archive native artifacts (Linux)
        if: ${{ runner.os == 'Linux' && matrix.jobtype == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: |
            src/main/resources/linux/x86_64/libsbtipcsocket.so
            src/main/resources/linux/aarch64/libsbtipcsocket.so
            src/main/resources/win32/x86_64/sbtipcsocket.dll
      - name: Archive native artifacts (macOS)
        if: ${{ matrix.os == 'macos-15-intel' }}
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: src/main/resources/darwin/x86_64/libsbtipcsocket.dylib
      - name: Test examples compilation
        shell: bash
        run: |
          cd examples/echo-server
          mvn package
